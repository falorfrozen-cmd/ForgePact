# Tag a ForgePact release from a typed version, and leave a draft carrying its
# notes.
#
# Run it from Actions > ForgePact tag > Run workflow, give it the tag, and it
# does the five things that otherwise happen by hand and in the wrong order:
# checks the tag is one this repository can actually release, moves the
# version to match, pushes the tag, leaves a draft release on it whose body is
# composed from the tagged version's own notes file, if one has been written
# (or, when it has not, GitHub's own generated notes under a banner demanding
# a rewrite), and starts the build workflow (`forgepact-release.yml`) against
# that tag.
#
# The build still stays a separate workflow, dispatched with `workflow_dispatch`
# rather than inlined here, and it is dispatched against `main` rather than the
# tag this job just pushed -- see `forgepact-release.yml`'s own header comment
# for why. This workflow itself still never builds, uploads or publishes; see
# "The build is dispatched, never inlined" below. Publishing the draft stays a
# human act, and it is what fires notify-hub-release.yml.
#
# Recut. With the `recut` input on, a version that was already cut but whose
# release is still an unpublished draft is cut again in the same run: the old
# draft and its tag are deleted, current main is tagged, a fresh draft is left
# with freshly composed notes, and the build is dispatched as usual, so the
# draft always carries a zip of what it is tagged at. Off (the default), an
# existing release refuses exactly as before. A published release, or a tag
# with no release, refuses either way: a published tag is never deleted or
# moved. See "The draft is still a draft (guard 2)" below.
name: ForgePact tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as, e.g. v1.3.21 (or just 1.3.21)'
        required: true
        type: string
      recut:
        description: 'Replace this version if its release is still an unpublished draft: delete the draft and its tag, then cut it again from main'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forgepact-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # Committing the version bump, pushing the tag, and leaving the draft
      # release.
      contents: write
      # Starting forgepact-release.yml. Without it the dispatch below is a
      # 403 from a job that has already pushed the tag and left the draft --
      # exactly the "tag exists, nothing is building it" state the dispatch
      # exists to avoid. The same permission the hub's tagger carries, for
      # the same reason.
      actions: write
    steps:
      # A release is cut from main. Run from anywhere else, the bump below
      # would push a branch's tree to main and the tag would point at code
      # that was never merged.
      - name: This has to be run from main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Run this from main. It was started on '$BRANCH', whose code is not what a release should ship."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Both the bump and the tag are made by this job, and the bump step is
      # skipped when the tree already matches -- so the identity is set once
      # here rather than in whichever step happens to run.
      - name: Commit as the bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Against the remote rather than the local clone, so this does not depend
      # on actions/checkout having fetched tags.
      - name: Which ForgePact versions are already tagged
        id: tags
        run: |
          # pipefail because this is the answer every later check is measured
          # against, and "no tags" is not the same answer as "could not ask".
          # git ls-remote | cut | tr exits with tr's status, so a failed query
          # would report success and an empty list -- and every check in
          # forgepact_tag.py that compares against existing tags would then
          # pass vacuously.
          set -o pipefail
          refs=$(git ls-remote --tags origin 'refs/tags/v*' | cut -f2 | tr '\n' ' ')
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "existing: ${refs:-none}"

      # Everything after this trusts the tag, so everything that could be
      # wrong with it is decided here: the shape, whether it is taken, whether
      # it would point releases/latest at something older than a tag already
      # published, and whether it is behind the tree main already holds.
      # tools/forgepact_tag.py has the reasoning and the tests; a refusal
      # exits non-zero having printed nothing, so no later step has a version
      # to act on. With recut on, the tag itself being taken is left to the
      # next step, which is the one that can see whether a draft is all that
      # sits on it.
      #
      # The typed string reaches the shell only through env:, never
      # interpolated into a run: line.
      - name: Is this a tag we can release
        id: plan
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RECUT: ${{ inputs.recut }}
          REFS: ${{ steps.tags.outputs.refs }}
        run: |
          recut=()
          if [ "$RECUT" = "true" ]; then
            recut=(--recut)
          fi
          # Captured rather than piped into $GITHUB_OUTPUT. GitHub runs this
          # as bash -e {0} with no pipefail, so a pipe would exit with tee's
          # status -- 0 -- and a refused tag would sail on into the bump, the
          # push and the tag with no version behind it.
          #
          # shellcheck disable=SC2086 -- REFS is a list of refs, and word
          # splitting is how it becomes separate arguments.
          plan=$(python tools/forgepact_tag.py --tag "$TAG_INPUT" "${recut[@]}" --existing $REFS)
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

      # forgepact_tag.py already refused a tag that exists, but a draft
      # release can be sitting on a tag that was never pushed -- a draft does
      # not create its tag -- so it is invisible both to that check and to
      # git. Last of the read-only checks, and deliberately still ahead of the
      # rewrite below: running it afterwards would mean the bump was
      # committed and pushed before the draft was discovered, leaving main
      # claiming a version with no release and no tag behind it.
      #
      # It is also the first of recut's two draft guards. With recut on, this
      # step is what decides a release may be replaced at all: exactly one,
      # and still a draft. Anything else refuses here, before anything is
      # written, and a published release is refused whatever the input says.
      # A tag with no release is refused too: that is the state a failed
      # "Leave a draft release" step leaves, and its recovery is by hand (the
      # module guide's "Tag-without-release recovery"), not a delete.
      - name: This version has no release yet (or recut replaces its draft)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          REFS: ${{ steps.tags.outputs.refs }}
          RECUT: ${{ inputs.recut }}
        run: |
          # One query, so the count, the draft flag and the id all describe
          # the same moment. Assigned before it is split so a failed query
          # stops the step (bash -e) instead of reading as an empty answer.
          found=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | \"\(length) \(.[0].draft) \(.[0].id)\"")
          read -r existing draft id <<< "$found"
          echo "releases already on $TAG: $existing"
          if [ "$existing" = "0" ]; then
            # forgepact_tag.py refused an existing tag unless recut is on, so
            # a tag here means recut was asked to replace a draft that is not
            # there.
            case " $REFS " in
              *" refs/tags/$TAG "*)
                echo "::error::$TAG is tagged but has no release, so there is no draft for recut to replace. Recover it by hand (module guide, \"Tag-without-release recovery\"), or tag a higher version."
                exit 1
                ;;
            esac
            if [ "$RECUT" = "true" ]; then
              echo "recut is on, but $TAG has no draft to replace; cutting it as a new version."
            fi
            echo "replace=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RECUT" != "true" ]; then
            echo "::error::$TAG already has $existing release(s), including drafts. If it is still an unpublished draft, run ForgePact tag again with recut on to replace it; otherwise tag a higher version."
            exit 1
          fi
          if [ "$existing" != "1" ]; then
            echo "::error::$TAG has $existing releases; recut replaces exactly one draft. Delete the extra ones by hand first."
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "::error::$TAG is already published. recut only replaces an unpublished draft: a published release and its tag are never deleted or moved. Tag a higher version."
            exit 1
          fi
          echo "draft release $id on $TAG will be replaced"
          echo "replace=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

      # Second draft guard, right before the only deletes this workflow makes.
      # It follows the first directly and costs a second, but it is its own
      # step so it stays the last thing before the delete if anything is ever
      # put between them -- the same shape as forgepact-release.yml's second
      # guard before its upload. It asks again rather than trusting the first
      # answer: the release must still be exactly one draft, and the same one.
      - name: The draft is still a draft (guard 2)
        if: steps.release.outputs.replace == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          ID: ${{ steps.release.outputs.release_id }}
        run: |
          found=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | \"\(length) \(.[0].draft) \(.[0].id)\"")
          read -r existing draft id <<< "$found"
          if [ "$existing" != "1" ] || [ "$draft" != "true" ] || [ "$id" != "$ID" ]; then
            echo "::error::$TAG changed since it was checked (releases: $existing, draft: $draft, id: $id; expected one draft, id $ID) -- refusing to delete anything. A human may have published it."
            exit 1
          fi
          echo "still one draft on $TAG (release $ID)"

      # Recut only, and only after both guards. Where the tag stands is asked
      # first, so a failed query deletes nothing. Then the release goes, by
      # the id both guards checked, and only then its tag: deleting the tag
      # first would leave the draft behind (a draft does not need its tag),
      # and a tag left over with no release is refused by the next run. The
      # tag is removed from the remote and, should the checkout have brought
      # it along, from this clone too, so "Tag it" below makes it afresh on
      # the commit this run is cutting.
      #
      # This runs ahead of the notes on purpose. GitHub's generate-notes
      # endpoint ignores target_commitish when the tag already exists and
      # measures up to that tag instead, so composing first would leave out
      # everything merged since the first cut -- the very work a recut is for.
      - name: Delete the old draft and its tag (recut)
        if: steps.release.outputs.replace == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          ID: ${{ steps.release.outputs.release_id }}
        run: |
          # 2 is git's "no such ref", which a draft on a never-pushed tag is;
          # anything else is a failed query, not an answer.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
          if [ "$status" != "0" ] && [ "$status" != "2" ]; then
            echo "::error::Could not ask origin whether $TAG exists (git ls-remote exited $status). Nothing was deleted."
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/releases/$ID"
          echo "deleted draft release $ID"
          if [ "$status" = "0" ]; then
            git push origin --delete "refs/tags/$TAG"
            echo "deleted tag $TAG on origin"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git tag -d "$TAG"
          fi

      # Called unconditionally, before any write, so the YAML has no branch on
      # whether the tagged version's own notes file exists -- that decision
      # belongs entirely to forgepact_tag.py, which has tests for it. This
      # step creates nothing and costs only a rerun if it fails; the
      # composition below ignores this generated text whenever the top file
      # exists. On a recut it runs after the old draft and tag are gone (see
      # the step above), and a rerun then finds nothing to replace and cuts
      # the version as new, with recut on or off.
      - name: Compose the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          SHA: ${{ github.sha }}
        run: |
          extra=()
          if [ -n "$PREVIOUS" ]; then
            extra=(-f "previous_tag_name=$PREVIOUS")
          fi
          generated=$(gh api -X POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" \
            "${extra[@]}" --jq .body)
          printf '%s' "$generated" > "$RUNNER_TEMP/generated.md"

          notes=$(python tools/forgepact_tag.py --compose-notes \
            --version "$VERSION" --previous "$PREVIOUS" \
            --generated "$RUNNER_TEMP/generated.md" \
            --out "$RUNNER_TEMP/release-notes.md")
          echo "$notes"
          echo "$notes" >> "$GITHUB_OUTPUT"

      # Only when the tree says something else. cut_release.py refuses to
      # write a tree whose fields already disagree, so a half-bumped main
      # stops here rather than being tagged.
      - name: Move the version to match the tag
        if: steps.plan.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python tools/cut_release.py "$VERSION"
          git commit --all --message "Cut $VERSION"
          # Before the tag, deliberately. If someone else's merge landed while
          # this ran, the push is rejected and the job fails having created
          # nothing -- rather than leaving a tag on a commit main never got.
          git push origin HEAD:main

      # What the tag points at has to agree with the tag. --allow-missing-notes
      # is why this workflow never refuses on a missing release-notes file: the
      # draft above already carries generated notes in that case, under a
      # banner demanding a rewrite before publishing.
      - name: Version fields agree
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: python tools/cut_release.py --check --expect "$VERSION" --allow-missing-notes

      - name: Tag it
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git tag -a "$TAG" -m "ForgePact $VERSION"
          git push origin "refs/tags/$TAG"

      # A tag exists with no release if this step fails -- the same state a
      # hand-made tag leaves, and it is recovered by creating the release by
      # hand from the composed notes above. No retry machinery.
      - name: Leave a draft release carrying the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "ForgePact $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      # Dispatched against main, not the tag this job just pushed -- the
      # tag's own tree does not carry forgepact-release.yml, the fetch
      # script or a compiler-discovery fix, for any version tagged before
      # this workflow existed, and a fix made to the build workflow could
      # never apply to an already-tagged version otherwise. See
      # forgepact-release.yml's header comment. If this dispatch fails, the
      # draft exists with no build behind it -- recovery is running
      # "ForgePact release" by hand with the same tag.
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh workflow run forgepact-release.yml --ref main -f tag="$TAG" -f dry_run=false
          echo "dispatched forgepact-release.yml for $TAG"

      - name: Say what still needs a human
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          BUMPED: ${{ steps.plan.outputs.bump }}
          REPLACED: ${{ steps.release.outputs.replace }}
          SOURCE: ${{ steps.notes.outputs.source }}
          VERSIONS: ${{ steps.notes.outputs.versions }}
        run: |
          {
            echo "### Tagged $TAG"
            echo
            if [ "$REPLACED" = "true" ]; then
              echo "**Recut.** The earlier draft of $TAG and its tag were deleted, and"
              echo "$TAG was cut again from the current \`main\`. Its body was composed"
              echo "afresh, so anything edited by hand in the old draft is gone."
              echo
            fi
            if [ "$BUMPED" = "true" ]; then
              echo "The version was moved to match, and that bump is on \`main\`."
              echo
              echo "This commit was made by github-actions[bot], so it does not fire"
              echo "notify-hub.yml; the hub's submodule-pointer bump PR waits for the"
              echo "next human merge to \`main\`."
            else
              echo "\`main\` was already at this version; nothing was rewritten."
            fi
            echo
            echo "Notes source: \`$SOURCE\` (versions: $VERSIONS)."
            if [ "$SOURCE" = "generated" ] || [ "$SOURCE" = "mixed" ]; then
              echo
              echo "**Rewrite the generated section for players before publishing** --"
              echo "it is GitHub's own pull-request-title text, not player language."
            fi
            echo
            echo "\"ForgePact release\" is building it now against this tag. What it"
            echo "leaves behind is still only a draft's assets -- nothing is published"
            echo "yet."
            echo
            echo "Remaining steps, all manual:"
            echo "1. Wait for the ForgePact release run to finish."
            echo "2. Download the zip from the draft and run the launch gate (module"
            echo "   guide, \"CI build launch gate\")."
            echo "3. Review the composed body, and rewrite any generated section."
            echo "4. Publish. That fires notify-hub-release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
