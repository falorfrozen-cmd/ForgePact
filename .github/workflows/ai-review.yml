name: AI Code Review

# Opt-in review. Nothing here runs on its own: a person either adds the
# `ai-review` label to a pull request or comments `@claude review` on it.
#
# There is deliberately no `on: pull_request` trigger. Review is requested, not
# automatic, so that routine pull requests -- a release-notes touch-up, a
# version bump -- do not each spend a review. This matches the hub repository,
# where automation opens pointer and catalog pull requests that have nothing to
# review.
#
# Requesting a review:
#   - Add the `ai-review` label in the PR sidebar, or
#   - comment `@claude review` on the PR.
#
# Anything written after the trigger phrase is passed to the reviewer as the
# requester's instructions and takes precedence over the default scope:
#   @claude review
#   @claude review only plugin/
#   @claude review skip the release notes, just the plugin and its tests
# The label carries no instructions, so it always requests a full review.
#
# Either one may be used again later for a fresh review after pushing changes;
# the label alone does not re-run on later pushes.
#
# Two gates beyond the triggers, both enforced by the action itself:
#   - the requesting user must have write access to this repository, and
#   - a bot actor is rejected, so labelling from automation cannot start a run.
#
# Two things must be in place or the job fails before it reviews anything:
#   - the Claude GitHub App (https://github.com/apps/claude) installed on this
#     repository. Without it the token exchange returns 401, "Claude Code is
#     not installed on this repository", and nothing runs.
#   - the `CLAUDE_CODE_OAUTH_TOKEN` secret, from `claude setup-token`.
#
# On a fork pull request GitHub withholds secrets, so the run cannot
# authenticate and the review does not happen. Branches pushed to this
# repository are unaffected, which is how work lands here.
#
# A pull request that touches the panel (`panel/`) also gets the UI design
# tooling the panel is developed with, reported in the same review comment
# under one heading per tool:
#   - impeccable's code-level audit (the `impeccable@impeccable` plugin, with
#     its detector run by this workflow over the changed panel files), and
#   - review-animations, for a change that alters motion, read from the hub
#     repository's vendored `.claude/skills/` (the Emil Kowalski skills).
# The `taste-skill@taste-skill` plugin is loaded too, as in the hub's
# `.claude/settings.json`, for the reviewer to draw on. There is no browser in
# this job, so anything that needs a running page or captures -- impeccable's
# live mode and detector overlays, `impeccable-finish-reviewer`, the panel's
# own `e2e:*` screenshot suites -- is out of scope here and stays a local step.
# Apart from the repository name and a few comments, everything else matches
# the hub repository's copy of this file and should stay so. The
# ForgePact-only parts are the steps named "List the panel
# files the change touches" through "Run impeccable's launcher", the two design
# plugins, the second prompt line and the "Fail if the design tools went
# unreported" step.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      github.repository == 'falorfrozen-cmd/ForgePact'
      && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '@claude review')
        )
      )
    # Concurrency lives on the job, and its group is only shared when the
    # event is a real request. Every issue comment and every label starts a
    # run of this workflow, including a plain "thanks" or an unrelated label.
    # At workflow level those runs joined `ai-review-<PR>` before the `if`
    # above was ever looked at, so with cancel-in-progress they cancelled a
    # review that was already running. An unrequested event now gets a group
    # unique to its own run and can cancel nothing, whether or not GitHub
    # evaluates the `if` before the group. The predicate is written out twice
    # because neither `concurrency` nor `if` can read a value the other
    # computes, so change both copies together. The hub repository carries the
    # same workflow, and its tests/test_ai_review_workflow.py pins that shape.
    concurrency:
      group: >-
        ${{
        (
        github.repository == 'falorfrozen-cmd/ForgePact'
        && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '@claude review')
        )
        )
        )
        && format('ai-review-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('ai-review-unrequested-{0}', github.run_id)
        }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A whole review of a large pull request takes longer than 30 minutes:
    # ForgePact #105 (67 files, 5,003 added lines, most of it panel CSS, plus
    # the design tooling) was cancelled at 30 with nothing posted, while a
    # scoped `@claude review` of one of its commits finished in 8. The review
    # step below has a shorter limit of its own, so a review that runs out of
    # time fails that step and the job still reaches the result upload,
    # rather than the whole job being cancelled.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's own head, with full history and every branch,
          # so the reviewer can diff a subset of paths against the base with
          # git instead of pulling the whole pull request through `gh pr diff`.
          # The code is only read, never built or run.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      # The check after the review counts only comments created after this.
      - name: Note when the review started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Turns the request into the text that follows the trigger phrase. The
      # comment body reaches the shell only through an environment variable,
      # never through `${{ }}` in the script, so it cannot inject commands.
      - name: Read the request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Empty for the label trigger.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # `@claude review` is 14 characters long.
          instructions=""
          if [ -n "$COMMENT_BODY" ]; then
            instructions="${COMMENT_BODY:14}"
            # Trim surrounding whitespace, including the \r of CRLF comments.
            instructions="${instructions#"${instructions%%[![:space:]]*}"}"
            instructions="${instructions%"${instructions##*[![:space:]]}"}"
          fi
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)

          # Changed files no reviewer needs to read: binaries (`--numstat`
          # prints `-` for them), licence texts and lockfiles. ForgePact #105
          # carried 27 images and fonts and two copies of a font licence.
          mapfile -t skip < <(
            {
              git diff --numstat --no-renames "origin/$base...HEAD" | awk -F'\t' '$1 == "-" { print $3 }'
              git diff --name-only --no-renames --diff-filter=d "origin/$base...HEAD" -- \
                '*LICENSE*' '*LICENCE*' '*COPYING*' '*OFL*.txt' '*/licenses/*' '*.lock' '*package-lock.json'
            } | sort -u
          )

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            echo
            echo "The pull request head is checked out in the working directory with full history."
            echo "\`git diff origin/$base...HEAD -- <pathspec>\` shows the pull request's changes for chosen paths only,"
            echo "and \`git diff --stat origin/$base...HEAD\` lists every changed file with its size."
            echo "Pathspecs can exclude too, for example \`-- . ':(exclude)*.md'\`."
            echo "If \`gh pr diff\` fails because the diff is too large, use git instead."
            # ForgePact #105's scoped review was refused four times trying to
            # write its comment to a file first, and posted on the fifth try.
            echo
            echo "Post each comment in one command: \`gh pr comment <number> --body \"\$(cat <<'EOF' ... EOF)\"\`."
            echo "Do not write it to a file first: this run cannot create files (Write and shell redirection"
            echo "are denied), and every refused attempt costs a turn."
            if [ "${#skip[@]}" -gt 0 ]; then
              echo
              echo "These changed files are binary, licence text or lockfiles. Do not read or report on them,"
              echo "and leave them out of \`git diff\` with \`':(exclude)<path>'\`:"
              printf -- '- %s\n' "${skip[@]}"
            fi
            if [ -n "$instructions" ]; then
              echo
              echo "The person who requested this review gave these instructions. They take precedence"
              echo "over the default scope of the review and over any step that would read more than they allow:"
              echo
              echo "<requester-instructions>"
              printf '%s\n' "$instructions"
              echo "</requester-instructions>"
              echo
              echo "Pass these instructions verbatim to every agent you launch. When they narrow what to read,"
              echo "do not run \`gh pr diff\`, whose output is the whole pull request: list the changed files with"
              echo "\`git diff --stat\` and read only the permitted ones with a git pathspec. A review was explicitly"
              echo "requested, so an earlier review on this pull request is not a reason to stop. State the scope"
              echo "you reviewed in the final comment."
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$instructions" ]; then
            echo "Requester instructions:"
            printf '%s\n' "$instructions"
          else
            echo "No requester instructions; full review."
          fi

      # ForgePact only, from here to "Run impeccable's launcher": the UI design
      # tooling for a change to the panel. `touched` is false for every other
      # pull request, and then `notes` is empty and nothing below runs.
      # Only the panel's own source counts; tests, build scripts, the built
      # `dist/` and dependencies are not UI a person sees.
      - name: List the panel files the change touches
        id: panel
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          mapfile -t files < <(
            git diff --name-only --diff-filter=d "origin/$base...HEAD" -- \
              'panel/*.svelte' 'panel/*.css' 'panel/*.html' 'panel/*.js' 'panel/*.ts' 'panel/*.mjs' \
              ':(exclude)panel/tests/*' ':(exclude)panel/scripts/*' \
              ':(exclude)panel/dist/*' ':(exclude)panel/node_modules/*' \
              ':(exclude)panel/*.config.js'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No panel source changed; the design tooling does not run."
            exit 0
          fi

          # A keyword scan of the added lines, as a pointer for the reviewer,
          # who still decides whether a change alters motion.
          motion=()
          for f in "${files[@]}"; do
            if git diff -U0 "origin/$base...HEAD" -- "$f" \
              | grep -qE '^\+.*(transition|animation|@keyframes|@starting-style|--motion-|data-instant|prefers-reduced-motion|requestAnimationFrame|\.animate\()'; then
              motion+=("$f")
            fi
          done

          mkdir -p .review-tools/out
          printf '%s\n' "${files[@]}" > .review-tools/out/panel-files.txt
          {
            echo "touched=true"
            echo "first=${files[0]}"
          } >> "$GITHUB_OUTPUT"

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            echo
            echo "## UI design tooling (this pull request changes the panel)"
            echo
            echo "Changed panel source files:"
            printf -- '- %s\n' "${files[@]}"
            echo
            echo "Besides the code review above, check these files with the tools below and report them in the"
            echo "same final \`gh pr comment\`, after the code review, under one \`###\` heading per tool."
            echo "This part is not subject to the code-review command's early stops or filter: post the comment"
            echo "with these sections even when the code review found nothing (step 6) or judged the change simple"
            echo "(step 1c), and do not drop a design finding for scoring under 80. Report every finding you"
            echo "verified, with its severity and a link to file and line; mark one you judge a false positive"
            echo "as such rather than leaving it out. A tool with nothing to report gets an explicit"
            echo "\"No findings.\" line; a tool that could not run says so and why. If the requester's"
            echo "instructions exclude the panel, keep the headings and write \"Not run: outside the requested scope.\""
            echo
            echo "\`panel/DESIGN.md\` and \`panel/.impeccable/design.json\`, where present, are the panel's design"
            echo "system as built; judge the change against them."
            echo
            echo "### impeccable audit"
            echo "Load the \`impeccable:impeccable\` skill with the Skill tool, argument \`audit\` followed by the files"
            echo "above, and follow its \`reference/audit.md\`. This run cannot execute the skill's launcher, so this"
            echo "workflow already ran it for you, from the same repository the plugin was installed from:"
            echo "\`.review-tools/out/impeccable-context.txt\` is the output of \`impeccable context\`, and"
            echo "\`.review-tools/out/impeccable-detect.json\` is \`impeccable detect --json\` over the files above"
            echo "(its exit status in \`impeccable-detect.exit\`: 0 clean, 2 findings, anything else a failed scan,"
            echo "with the reason in \`impeccable-detect.stderr\`). Read those instead of running the launcher."
            echo "This is a code-level audit: there is no browser here, so skip whatever needs a running page"
            echo "(live mode, detector overlays, screenshots) and say the audit was code-only. Post the health"
            echo "score table and the findings, P0 to P3."
            echo
            echo "### review-animations"
            if [ "${#motion[@]}" -gt 0 ]; then
              echo "Added lines that look like motion (a keyword scan; use your own judgement too):"
              printf -- '- %s\n' "${motion[@]}"
            else
              echo "A keyword scan found no added motion lines; confirm that from the diff yourself."
            fi
            echo "For any change that alters motion, read \`.review-tools/hub/.claude/skills/review-animations/SKILL.md\`"
            echo "with the Read tool (it is \`disable-model-invocation\`, so the Skill tool refuses it) and review"
            echo "the motion against it. The other skills it refers to sit beside it in \`.review-tools/hub/.claude/skills/\`."
            echo "If nothing in the change alters motion, write \"No motion changes; not run.\""
            echo
            echo "The \`taste-skill\` plugin is loaded as well. If you use one of its skills, report what it found"
            echo "under its own \`### taste-skill\` heading."
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          printf 'Panel files: %s\n' "${files[*]}"
          printf 'Motion keywords in: %s\n' "${motion[*]:-(none)}"

      # The hub repository is the one source of truth for the vendored Emil
      # skills (its `.claude/skills/THIRD_PARTY.md` pins their upstream
      # commit), so they are read from there rather than copied into this
      # repository, where a second copy could drift. The hub is public, so the
      # job's own token reads it; only `.claude/skills` is checked out.
      - name: Check out the hub's vendored UI skills
        if: steps.panel.outputs.touched == 'true'
        uses: actions/checkout@v6
        with:
          repository: falorfrozen-cmd/hero-siege-offline-toolkit
          ref: main
          path: .review-tools/hub
          sparse-checkout: .claude/skills
          persist-credentials: false

      # impeccable's skill starts by running its launcher (`impeccable
      # context`, then `impeccable detect` for the audit). The launcher sits
      # under the plugin's versioned install directory, and a Bash permission
      # rule cannot name that path without a leading `*`, which Claude Code
      # warns against because it would match far more than the launcher. So the
      # workflow runs the launcher itself, from the same repository and branch
      # the plugin is installed from, and hands the reviewer the output: the
      # detector's result then does not depend on a permission rule matching.
      - name: Check out impeccable's launcher
        if: steps.panel.outputs.touched == 'true'
        uses: actions/checkout@v6
        with:
          repository: pbakaus/impeccable
          path: .review-tools/impeccable
          sparse-checkout: plugin/skills/impeccable
          persist-credentials: false

      # The launcher downloads its engine binary for this platform on first
      # use and refuses one whose SHA-256 does not match the release's. A
      # failed scan does not fail the job: its exit status and stderr reach
      # the reviewer, whose section must then say the detector did not run.
      - name: Run impeccable's launcher
        if: steps.panel.outputs.touched == 'true'
        env:
          FIRST: ${{ steps.panel.outputs.first }}
        run: |
          launcher=.review-tools/impeccable/plugin/skills/impeccable/scripts/impeccable
          out=.review-tools/out
          echo "impeccable $(git -C .review-tools/impeccable rev-parse HEAD), engine $(cat "${launcher%/*}/VERSION")"
          sh "$launcher" context --target "$FIRST" > "$out/impeccable-context.txt" 2>&1 \
            || echo "(impeccable context exited $?)" >> "$out/impeccable-context.txt"
          mapfile -t files < "$out/panel-files.txt"
          set +e
          sh "$launcher" detect --json "${files[@]}" > "$out/impeccable-detect.json" 2> "$out/impeccable-detect.stderr"
          echo $? > "$out/impeccable-detect.exit"
          set -e
          echo "detect exit $(cat "$out/impeccable-detect.exit")"
          cat "$out/impeccable-detect.stderr"

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 55
        env:
          # Makes every Agent call run in the foreground. The code-review
          # command runs its whole review through subagents, and agents run in
          # the background by default. A CI run ends when the model ends its
          # turn, so on hub #59 the model started its eligibility check in the
          # background, ended its turn "waiting for the completion
          # notification", and the session ended there: nothing was reviewed,
          # nothing was posted, and the job went green.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # A subscription OAuth token from `claude setup-token`, not an API
          # key, stored as a repository secret here. Same arrangement as the
          # hub repository; the hub's docs/hub/design.md documents it under
          # "Repository secrets".
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One entry per line. The two design plugins are the ones the hub's
          # `.claude/settings.json` enables for the project (ForgePact only;
          # see the header). They load on every run, which keeps this block
          # plain; only a panel change's prompt asks for them.
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/pbakaus/impeccable.git
            https://github.com/Leonxlnx/taste-skill.git
          plugins: |
            code-review@claude-code-plugins
            impeccable@impeccable
            taste-skill@taste-skill
          # The second notes line is empty unless the change touches the panel.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}
            ${{ steps.request.outputs.notes }}
            ${{ steps.panel.outputs.notes }}
          # `--allowedTools` is the whole allow-list for the run, not an addition
          # to the skill's own. It must name every tool the code-review command
          # declares in its `allowed-tools` frontmatter. The first version named
          # only the inline-comment tool: `gh pr view` and `gh pr diff` were
          # denied, so the review could not read the pull request, and
          # `gh pr comment` was denied, so its "No issues found" summary could
          # not post either. The job still went green, with
          # `permission_denials_count: 5` and nothing on the PR (hub #56). The
          # inline-comment tool must stay listed: the action only starts the MCP
          # server that posts inline comments when this argument names it.
          # `Skill` is listed because the prompt is a plugin command: without
          # it that first call is a permission denial (hub #59). The read-only
          # git commands and Read/Grep/Glob let a scoped request read only the
          # part of the change it names.
          # The panel's design tooling adds nothing to this list, deliberately:
          # the impeccable skill loads through `Skill`, its reference files and
          # the launcher output this workflow wrote to `.review-tools/out/` are
          # read with `Read`, and review-animations is a file read with `Read`.
          # The one thing the skill would otherwise execute, its launcher (no
          # Node or npx: a self-contained binary), runs in "Run impeccable's
          # launcher" above instead, for the reason given there.
          claude_args: '--allowedTools "Skill,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*)"'

      # The action succeeds whenever the model exits cleanly, which includes
      # a run that reviewed nothing -- hub #56 (tools denied) and hub #59 (the
      # session ended while a background agent was still working) both went
      # green with nothing on the PR. So the job checks the outcome itself:
      # if no comment or inline comment appeared on the PR after the review
      # started, it fails and prints the review's last message. A run whose
      # eligibility check deliberately stopped (the PR is closed or a draft,
      # or Claude has already commented) also goes red here, with that reason
      # printed: a review was requested and none was posted.
      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
          RESULT_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          count() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/$1?since=$SINCE&per_page=100" \
              --jq "[.[] | select(.created_at >= \"$SINCE\")] | length" \
              | awk '{ total += $1 } END { print total + 0 }'
          }
          comments=$(count "issues/$PR/comments")
          inline=$(count "pulls/$PR/comments")
          echo "Posted since $SINCE: $comments comment(s), $inline inline comment(s)."
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review posted nothing on #$PR. Its last message:"
            jq -r '[.[] | select(.type == "result")] | last | .result // "(no result recorded)"' "$RESULT_FILE" || true
            exit 1
          fi

      # ForgePact only. A panel change was reviewed with the design tooling,
      # so a comment posted since the review started must carry each tool's
      # heading, with its findings, "No findings." or the reason it did not
      # run. Without this check a review that skipped the tools, or dropped
      # their findings, would go green exactly as hub #56 and #59 did.
      - name: Fail if the design tools went unreported
        if: steps.panel.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          bodies=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE&per_page=100" \
            --jq ".[] | select(.created_at >= \"$SINCE\") | .body")
          missing=()
          for heading in "### impeccable audit" "### review-animations"; do
            grep -qF "$heading" <<< "$bodies" || missing+=("$heading")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::The review changed the panel but posted no section for: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Both design tool sections were posted."

      # The action prints a trimmed result to the log: per-model token counts
      # are dropped, and the full result file stays on the runner, which is
      # gone once the job ends. Keeping it is the only way to see what a review
      # used or what it was denied. It also holds the review transcript, which
      # is visible to anyone with read access to this repository.
      - name: Keep the run's full result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14
