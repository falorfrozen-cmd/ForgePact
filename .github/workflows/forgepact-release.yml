# Build the ForgePact release zip in CI and upload it to the tag's draft
# release.
#
# Started two ways: forgepact-tag.yml starts this workflow right after it
# leaves the draft, passing the tag as an input (see that workflow's "Start
# the build" step) -- the way hub-tag.yml starts hub-release.yml -- except
# THIS workflow is dispatched against `main`, never against the tag ref. A
# person can also run it by hand with a `tag` input, e.g. to fill a draft that
# already exists (v1.3.20, whose tag tree predates this workflow entirely).
#
# Why `main` and not the tag: v1.3.20's tag tree has none of this -- no
# forgepact-release.yml, no fetch script, no vswhere-aware build.bat -- so
# `--ref v1.3.20` could not run at all, and a fix made here could never apply
# to an already-tagged version. The plugin and panel source, the packaging
# script and the tests still come from the TAG (checked out into
# `ForgePact`); only the pins, the fetch/package scripts and build.bat's
# compiler discovery come from `main` (checked out into `forgepact-ci`). See
# the module guide, "The build half (forgepact-release.yml)".
#
# Three jobs. `build` checks the tag, runs every contract test except the
# panel's browser suites, compiles, packages and keeps the zip as an
# artifact. `panel-browser-tests` runs those browser suites (the modules
# declaring `PARALLEL_GROUP = "panel-browser"`) beside it, on a runner of its
# own, because they were most of a 27-minute serial test step once the panel
# was built here and they stopped skipping. `upload` waits for both, checks
# the artifact is the zip `build` hashed, and puts it on the draft. Both test
# jobs run the tag's tests through main's tools/run_tests_parallel.py, whose
# --skip-group/--only-group split covers the suite exactly once between them.
#
# It only ever uploads assets onto an EXISTING DRAFT release -- it never
# makes a new release object, never edits one, never flips a release out of
# draft, and never touches which release is "latest". Publishing stays a
# human act, and the module guide's CI launch gate is what that human runs --
# installing from this exact zip and launching the game -- before pressing
# Publish.
name: ForgePact release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v1.3.20 (or just 1.3.20)'
        required: true
        type: string
      dry_run:
        description: 'Build and test without uploading anything to the draft'
        type: boolean
        required: false
        default: true
      hub_ref:
        description: 'hs-game-sdk is checked out from the hub at this ref'
        type: string
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: forgepact-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      # Guard 1 lists the tag's DRAFT release, and the Releases API lists
      # drafts only to a token with push access, so `contents: read` would
      # see none and refuse every run. This job writes nothing; `upload`
      # does.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      source_commit: ${{ steps.source_commit.outputs.sha }}
      zip_hash: ${{ steps.package.outputs.zip_hash }}
    steps:
      # A release is built from main -- see the header comment for why this
      # workflow does not take the tag ref itself.
      - name: This has to be run from main
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Run this from main. It was started on '$BRANCH'."
            exit 1
          fi

      # The pins, the fetch/package scripts and build.bat's compiler
      # discovery -- everything a CI checkout needs that the tag's own tree
      # does not carry.
      - uses: actions/checkout@v4
        with:
          path: forgepact-ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Normalise the tag
        id: tag
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          plan=$(python forgepact-ci/tools/release_ci.py tag --tag "$TAG_INPUT")
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

      # First of two draft guards -- this one before any checkout of the tag,
      # so a bad tag or an already-published release fails fast on a cheap
      # step. The second sits right before the upload, because a human can
      # publish the draft during the ~15 minutes this job runs.
      - name: This release exists and is still a draft (guard 1)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          count=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$count" = "0" ]; then
            echo "::error::$TAG has no release yet -- run \"ForgePact tag\" first."
            exit 1
          fi
          if [ "$count" != "1" ]; then
            echo "::error::$TAG has $count releases; expected exactly one."
            exit 1
          fi
          draft=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].draft")
          if [ "$draft" != "true" ]; then
            echo "::error::$TAG is already published -- refusing to replace a published release's assets."
            exit 1
          fi
          echo "draft release confirmed for $TAG"

      # hs-game-sdk comes from the hub at inputs.hub_ref (default main), not
      # from any hub commit whose ForgePact gitlink matches this tag -- at
      # dispatch time that commit usually does not exist yet. Sparse, and
      # into its own directory first: checking a second repository straight
      # onto the workspace root would need to be the very first checkout of
      # the job (actions/checkout wipes the target path), and forgepact-ci
      # above already needed to go first so the tag could be normalised.
      - name: Check out hs-game-sdk from the hub
        uses: actions/checkout@v4
        with:
          repository: falorfrozen-cmd/hero-siege-offline-toolkit
          ref: ${{ inputs.hub_ref }}
          path: hub
          sparse-checkout: |
            hs-game-sdk
          sparse-checkout-cone-mode: false

      # build.bat compiles against ../../hs-game-sdk/cpp/include relative to
      # plugin_build/, i.e. two directories up from ForgePact/ -- the
      # workspace root. So hs-game-sdk has to end up there, a sibling of
      # ForgePact (checked out next), not nested under hub/.
      - name: Place hs-game-sdk as a sibling of ForgePact
        id: hub_commit
        shell: bash
        run: |
          mv hub/hs-game-sdk hs-game-sdk
          echo "sha=$(git -C hub rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The plugin and panel source, the packaging script, tools/cut_release.py,
      # tests/ and the compile line all come from the tag, never from main.
      - name: Check out the tagged ForgePact tree
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: ForgePact

      - name: Record the source commit
        id: source_commit
        shell: bash
        working-directory: ForgePact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # webview's absence is silent: a PyInstaller build on a machine without
      # it produces a panel that falls back to the browser with no error.
      - name: Install build/package dependencies
        shell: bash
        run: |
          python -m pip install -r forgepact-ci/requirements-build.txt
          python -c "import webview, PyInstaller"

      - name: The tree agrees with the tag
        shell: bash
        working-directory: ForgePact
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python tools/cut_release.py --check --expect "$VERSION" --allow-missing-notes

      # The panel's frontend (panel/, Svelte + Vite) is tracked as source only.
      # The packaging script refuses to run without panel/dist, and the
      # contract tests below read the panel, so the tag's own tree is built
      # here, installing exactly its own lockfile rather than resolving
      # newer versions at release time.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ForgePact/panel/package-lock.json

      - name: Install the panel's build dependencies
        shell: bash
        working-directory: ForgePact/panel
        run: npm ci

      - name: Build the panel (panel/dist)
        shell: bash
        working-directory: ForgePact/panel
        run: npm run build

      # The native harnesses (test_headhunter_dispatch.py, etc.) find MSVC
      # via vswhere themselves -- see AGENTS.md's "Prove the instrument"; they
      # are not skipped on a runner that has a compiler.
      #
      # main's runner, not the tag's: a tag cut before it existed still runs
      # in parallel. The panel's browser suites run in panel-browser-tests.
      # test_panel_perf is left out on CI: it holds frame timings to hard
      # budgets, which on a shared 4-core runner measure the runner, not the
      # panel, and a flaky budget would block a release that main's own runs
      # already cleared. It runs locally, alone, before a release is cut
      # (module guide, "The build half (forgepact-release.yml)").
      - name: Contract tests (all but the panel's browser suites)
        shell: bash
        working-directory: ForgePact
        run: |
          skip=()
          if [ -f tests/test_panel_perf.py ]; then
            skip=(--exclude-module test_panel_perf)
          fi
          python ../forgepact-ci/tools/run_tests_parallel.py -s tests -v \
            --state-dir "$RUNNER_TEMP/test-state" \
            --skip-group panel-browser "${skip[@]}"

      - name: Fetch the pinned toolchain
        shell: bash
        run: python forgepact-ci/tools/fetch_toolchain.py --root ForgePact

      # Discovery may differ between the tag's build.bat and main's; what
      # gets compiled may not. Only once that is proven does main's copy (the
      # one that can find MSVC on this runner) replace the tag's own.
      - name: The copied build.bat still compiles the same thing
        shell: bash
        run: |
          python forgepact-ci/tools/release_ci.py compile-line \
            --tag-bat ForgePact/plugin_build/build.bat \
            --ci-bat forgepact-ci/plugin_build/build.bat
          cp forgepact-ci/plugin_build/build.bat ForgePact/plugin_build/build.bat

      # Independent of the compile step below -- build.bat's own `setlocal`
      # rolls back the vcvars environment it sets up before returning, so
      # there is nothing left to read `cl`'s banner from afterwards.
      # `cl` writes its banner to stderr and its usage line to stdout, and cmd
      # applies redirections left to right: `> file 2>&1` captures both, while
      # `2>&1 > file` sends the banner to the log and keeps only the usage
      # line (what v1.3.20's first dry run recorded). Pick the banner line by
      # content rather than position.
      - name: Find the compiler version for BUILD-INFO.json
        id: cl_version
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cl > "%RUNNER_TEMP%\cl_banner.txt" 2>&1
          set CL_BANNER=
          for /f "usebackq delims=" %%b in (`findstr /c:"Compiler Version" "%RUNNER_TEMP%\cl_banner.txt"`) do if not defined CL_BANNER set CL_BANNER=%%b
          if not defined CL_BANNER set CL_BANNER=unknown
          echo banner=%CL_BANNER%>>"%GITHUB_OUTPUT%"

      # The plugin's symbols (issue #76): an incident report names a crash by
      # module and offset, and only this tag's PDB maps an offset inside
      # BloodPactPlugin.dll to one of our functions. build.bat's cl line is
      # the compile contract that the compile-line check above holds every
      # tag to, so the options come from the environment instead: cl prepends
      # CL's and link appends _LINK_'s. /DEBUG would turn /OPT:REF and
      # /OPT:ICF off, so both are named; /PDBALTPATH keeps the runner's
      # build path out of the shipped DLL. tests/test_release_pdb_symbols.py
      # compiles a probe under exactly these values: the compiler's code is
      # byte-identical to a plain build's and every function keeps its
      # address; only .rdata's layout moves (the debug directory grows).
      - name: Compile the plugin (release)
        shell: cmd
        working-directory: ForgePact
        env:
          CL: /Zi
          _LINK_: /DEBUG:FULL /OPT:REF /OPT:ICF /PDBALTPATH:BloodPactPlugin.pdb
        run: plugin_build\build.bat release

      - name: Package the panel (build_release.py)
        shell: bash
        working-directory: ForgePact
        run: python build_release.py

      - name: Zip the release (release_ci.py package)
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source_commit.outputs.sha }}
          HUB_COMMIT: ${{ steps.hub_commit.outputs.sha }}
          CL_VERSION: ${{ steps.cl_version.outputs.banner }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ImageOS/ImageVersion are the runner machine's own environment
        # variables. The `env` expression context only holds variables the
        # workflow itself defines, so `${{ env.ImageOS }}` is always empty
        # (v1.3.20's first dry run recorded "-"). Read them in the shell.
        run: |
          RUNNER_IMAGE="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          out=$(python forgepact-ci/tools/release_ci.py package --root ForgePact --version "$VERSION" \
            --out "$RUNNER_TEMP/out" \
            --info source_commit="$SOURCE_COMMIT" \
            --info tag="$TAG" \
            --info hub_commit="$HUB_COMMIT" \
            --info runner_image="$RUNNER_IMAGE" \
            --info cl_version="$CL_VERSION" \
            --info workflow_run_url="$WORKFLOW_RUN_URL")
          echo "$out"
          echo "zip_hash=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"

      # How the zip reaches the upload job; on a dry run, which never touches
      # the draft, it is also the way to inspect the zip without re-running.
      - name: Keep the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgepact-release-zip
          path: |
            ${{ runner.temp }}/out/*
          retention-days: 7
          if-no-files-found: error

      # The compile step's PDB, kept for a maintainer mapping a crash offset
      # from an incident report to a function. It never enters the zip, which
      # takes the DLL alone, and the upload job never fetches it. Kept on dry
      # runs too, and for 90 days: a crash report arrives after the release.
      - name: Keep the plugin's PDB as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgepact-plugin-pdb-${{ steps.tag.outputs.tag }}
          path: ForgePact/plugin_build/BloodPactPlugin_ship.pdb
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP_HASH: ${{ steps.package.outputs.zip_hash }}
          HUB_SHA: ${{ steps.hub_commit.outputs.sha }}
          CL_VERSION: ${{ steps.cl_version.outputs.banner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### ForgePact release: $TAG"
            echo
            echo "- zip sha256: \`$ZIP_HASH\`"
            echo "- hub commit (hs-game-sdk): \`$HUB_SHA\`"
            echo "- compiler: \`$CL_VERSION\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- dry run: nothing uploaded"
            else
              echo "- the upload job puts it on the draft once both test jobs pass"
            fi
            echo
            echo "**Not live-verified.** Install from this zip and launch the"
            echo "game before publishing -- see the module guide's \"CI build"
            echo "launch gate\" table."
          } >> "$GITHUB_STEP_SUMMARY"

  # The panel's browser suites, beside `build` rather than inside it: they
  # need only the tagged panel built, not the SDK, the Python build
  # dependencies or a compiler.
  panel-browser-tests:
    runs-on: windows-2025-vs2026
    # The job takes about ten minutes. A tag's own harness can hang instead of
    # failing: until the browser tooling killed a sandbox that started too
    # late, that sandbox kept its suite's pipes open, and `_npm`'s timeout then
    # waited on them for good. GitHub's default would hold the runner for six
    # hours; this limit applies to every tag, old ones included.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: This has to be run from main
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Run this from main. It was started on '$BRANCH'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: forgepact-ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Normalise the tag
        id: tag
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          plan=$(python forgepact-ci/tools/release_ci.py tag --tag "$TAG_INPUT")
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

      # The panel's sandbox imports hs-game-sdk from a sibling of the ForgePact
      # checkout (src/forgepact.py). Without it the Satanic Zone pool is
      # empty, and the browser suites fail on the environment, not on the
      # panel: 2.0.0's first recut failed e2e, finish, gems, review and the
      # oracle replay here while all of them passed locally. Same source and
      # placement as the build job's SDK steps above.
      - name: Check out hs-game-sdk from the hub
        uses: actions/checkout@v4
        with:
          repository: falorfrozen-cmd/hero-siege-offline-toolkit
          ref: ${{ inputs.hub_ref }}
          path: hub
          sparse-checkout: |
            hs-game-sdk
          sparse-checkout-cone-mode: false

      - name: Place hs-game-sdk as a sibling of ForgePact
        shell: bash
        run: mv hub/hs-game-sdk hs-game-sdk

      - name: Check out the tagged ForgePact tree
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: ForgePact

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ForgePact/panel/package-lock.json

      - name: Install the panel's build dependencies
        shell: bash
        working-directory: ForgePact/panel
        run: npm ci

      - name: Build the panel (panel/dist)
        shell: bash
        working-directory: ForgePact/panel
        run: npm run build

      # A browser suite skips when node, Edge, playwright-core or panel/dist
      # is missing, and a skip reads as OK -- so here, where all of them are
      # meant to be present, a skip fails the job (AGENTS.md, "Prove the
      # instrument"). A tag older than the PARALLEL_GROUP markers runs no
      # module here; build runs all of them instead.
      - name: Contract tests (the panel's browser suites)
        shell: bash
        working-directory: ForgePact
        run: |
          set -o pipefail
          python ../forgepact-ci/tools/run_tests_parallel.py -s tests -v \
            --state-dir "$RUNNER_TEMP/test-state" \
            --only-group panel-browser 2>&1 | tee "$RUNNER_TEMP/browser-tests.log"
          if grep -Eq '^(OK|FAILED) \(.*skipped=' "$RUNNER_TEMP/browser-tests.log"; then
            echo "::error::a panel browser suite skipped on a runner meant to have everything it needs"
            exit 1
          fi

  # The only job that writes to the draft, and only once both test jobs
  # passed.
  upload:
    needs: [build, panel-browser-tests]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      # Uploading assets to the draft. Nothing here starts another workflow
      # run, so this job needs no permission over the Actions API itself.
      contents: write
    steps:
      - name: Fetch the zip build made
        uses: actions/download-artifact@v4
        with:
          name: forgepact-release-zip
          path: ${{ runner.temp }}/out

      # The artifact is the zip build hashed, or nothing is uploaded.
      - name: The zip is the one build hashed
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ZIP_HASH: ${{ needs.build.outputs.zip_hash }}
        run: |
          got=$(sha256sum "$RUNNER_TEMP/out/ForgePact-$VERSION.zip" | cut -d' ' -f1)
          if [ -z "$ZIP_HASH" ] || [ "$got" != "$ZIP_HASH" ]; then
            echo "::error::the artifact hashes to $got, but build reported '$ZIP_HASH' -- refusing to upload."
            exit 1
          fi

      # Second draft guard, right before the write this job exists to make.
      # A human can publish the draft while build was running, and the
      # upload step below is only safe with --clobber because both guards
      # ran.
      #
      # It also checks the tag still points at the commit build built.
      # forgepact-tag.yml's recut deletes a draft and its tag, makes both
      # again on a newer commit and starts its own build; a build of the old
      # commit still running would then find a draft on "its" tag and put the
      # old zip on the new draft. A tag that is gone fails the lookup, which
      # refuses too.
      - name: This release is still a draft (guard 2)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          draft=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].draft")
          if [ "$draft" != "true" ]; then
            echo "::error::$TAG is no longer a draft -- refusing to upload. A human may have published it during this build."
            exit 1
          fi
          tagged=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          if [ "$tagged" != "$SOURCE_COMMIT" ]; then
            echo "::error::$TAG now points at $tagged, not $SOURCE_COMMIT, which the build job built -- refusing to upload. It was recut during this build; the recut's own build fills the new draft."
            exit 1
          fi

      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/out/ForgePact-$VERSION.zip" \
            "$RUNNER_TEMP/out/ForgePact-$VERSION.zip.sha256" \
            --clobber --repo "$REPO"
